[project]
name = "policylens"
version = "0.1.0"
description = "Policy data quality checks for insurance spreadsheets"
requires-python = ">=3.9"
dependencies = ["pandas", "openpyxl"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
